<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Tenant Bot Demo | nachinaxbot.tech</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #0f172a; color: #f8fafc; }

    /* Top Header Bar */
    #demo-header {
      background: #1e293b;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .header-title { font-size: 16px; font-weight: 600; color: #38bdf8; }
    .tenant-select {
      background: #0f172a;
      color: #fff;
      border: 1px solid #475569;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    /* Main Split Screen Container */
    #main-container { display: flex; flex: 1; overflow: hidden; }

    /* Left Panel: Chat Placeholder Area */
    #chat-preview-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-right: 1px solid #334155;
    }

    /* Right Panel: Live Backend Event Drawer */
    #side-panel {
      width: 400px;
      background: #1e293b;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #334155;
    }
    .panel-header {
      padding: 16px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #feed-logs { flex: 1; padding: 16px; overflow-y: auto; }
    .event-card {
      background: #0f172a;
      border-left: 4px solid #10b981;
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .event-time { color: #94a3b8; font-size: 11px; margin-bottom: 4px; }
    .event-payload { background: #1e293b; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 12px; color: #38bdf8; margin-top: 6px; }
  </style>
</head>
<body>

  <!-- STEP 2: Demo Header Dropdown Switcher -->
  <header id="demo-header">
    <div class="header-title">⚡ nachinaxbot.tech Multi-Tenant Engine</div>
    <div>
      <label for="tenant-dropdown" style="margin-right: 8px; font-size: 14px; color: #94a3b8;">Select Demo Tenant:</label>
      <select id="tenant-dropdown" class="tenant-select" onchange="switchTenant(this.value)">
        <option value="city-care-clinic">🏥 City Care Clinic (Healthcare)</option>
        <option value="prime-realty">🏡 Prime Realty (Real Estate)</option>
      </select>
    </div>
  </header>

  <!-- Split Screen Layout -->
  <div id="main-container">
    <div id="chat-preview-area">
      <h2 id="current-tenant-title">City Care Clinic</h2>
      <p style="color: #94a3b8; margin-top: 8px;">Chat widget is loaded in the bottom corner configured for this tenant.</p>
    </div>

    <!-- STEP 3: Live Backend Action Drawer -->
    <div id="side-panel">
      <div class="panel-header">
        <span>📡 Live Backend Event Feed</span>
        <button onclick="clearLogs()" style="background: none; border: none; color: #ef4444; cursor: pointer; font-size: 12px;">Clear</button>
      </div>
      <div id="feed-logs">
        <!-- Event cards will be inserted dynamically -->
      </div>
    </div>
  </div>

  <script>
    let currentTenant = 'city-care-clinic';

    // Dynamic Tenant Switcher Function
    function switchTenant(tenantId) {
      currentTenant = tenantId;
      const isClinic = tenantId === 'city-care-clinic';

      // Update UI Titles & Theme Colors
      document.getElementById('current-tenant-title').innerText = isClinic ? 'City Care Clinic' : 'Prime Realty';
      const themeColor = isClinic ? '#0e7490' : '#b45309';

      // Re-initialize YellammaBot Widget instance
      if (window.YellammaBot && typeof window.YellammaBot.init === 'function') {
        YellammaBot.init({
          tenantId: tenantId,
          apiEndpoint: "https://api.nachinaxbot.tech/v1/chat",
          themeColor: themeColor
        });
      }

      // Log event to side panel for presentation effect
      logBackendEvent('TENANT_ENVIRONMENT_SWITCHED', { tenantId, themeColor });
    }

    // Function to render real-time backend cards to side drawer
    function logBackendEvent(eventType, payload) {
      const logsContainer = document.getElementById('feed-logs');
      const card = document.createElement('div');
      card.className = 'event-card';
      card.innerHTML = `
        <div class="event-time">${new Date().toLocaleTimeString()} - <strong>${eventType}</strong></div>
        <div class="event-payload">${JSON.stringify(payload, null, 2)}</div>
      `;
      logsContainer.prepend(card);
    }

    function clearLogs() {
      document.getElementById('feed-logs').innerHTML = '';
    }

    // Initialize with default tenant on startup
    document.addEventListener("DOMContentLoaded", () => {
      switchTenant('city-care-clinic');
    });
  </script>
</body>
</html>
