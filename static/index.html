<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAXBOT AI | Salon Receptionist Demo</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f3ee;
      color: #2e2e2e;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(100%, 760px);
      height: min(760px, calc(100vh - 48px));
      min-height: 560px;
      background: #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #2f5d50;
      color: white;
      padding: 22px 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 7px 0 0;
      opacity: 0.9;
      font-size: 14px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      background: #fbfaf8;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 78%;
      padding: 12px 15px;
      border-radius: 14px;
      white-space: pre-wrap;
      line-height: 1.45;
      font-size: 15px;
    }

    .bot {
      align-self: flex-start;
      background: #e8f0ec;
      border-bottom-left-radius: 4px;
    }

    .user {
      align-self: flex-end;
      background: #2f5d50;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .typing {
      align-self: flex-start;
      background: #e8f0ec;
      color: #4b4b4b;
      font-size: 14px;
      font-style: italic;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #e7e1da;
      background: white;
    }

    #messageInput {
      flex: 1;
      border: 1px solid #cfc7bf;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }

    #messageInput:focus {
      border-color: #2f5d50;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 0 20px;
      background: #2f5d50;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer {
      text-align: center;
      padding: 9px;
      font-size: 12px;
      color: #777;
      background: white;
    }

    @media (max-width: 600px) {
      body { padding: 0; }

      .app {
        width: 100%;
        height: 100vh;
        min-height: 100vh;
        border-radius: 0;
      }

      .message { max-width: 88%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>NAXBOT AI Receptionist</h1>
      <p>Salon appointment and customer support assistant</p>
    </header>

    <section id="messages" aria-live="polite"></section>

    <form class="input-area" id="chatForm">
      <input
        id="messageInput"
        type="text"
        placeholder="Type your message..."
        autocomplete="off"
        required
      />
      <button id="sendButton" type="submit">Send</button>
    </form>

    <footer class="footer">Powered by Yellamma AI Engine</footer>
  </main>

  <script>
    const messages = document.getElementById("messages");
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    function addMessage(text, type) {
      const bubble = document.createElement("div");
      bubble.className = `message ${type}`;
      bubble.textContent = text;
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    function setLoading(isLoading) {
      sendButton.disabled = isLoading;
      messageInput.disabled = isLoading;
    }

    addMessage(
      "Hello! Welcome to NAXBOT AI.\n\nI can help you with salon services, pricing information, and appointment bookings.",
      "bot"
    );

    chatForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = messageInput.value.trim();
      if (!message) return;

      addMessage(message, "user");
      messageInput.value = "";
      setLoading(true);

      const typing = addMessage("Typing...", "typing");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            business_id: "salon",
            message: message
          })
        });

        const data = await response.json();
        typing.remove();

        if (!response.ok) {
          addMessage(data.detail || "Something went wrong. Please try again.", "bot");
          return;
        }

        addMessage(data.reply, "bot");
      } catch (error) {
        typing.remove();
        addMessage("Unable to connect to the assistant. Please try again.", "bot");
      } finally {
        setLoading(false);
        messageInput.focus();
      }
    });
  </script>
</body>
</html>
